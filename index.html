<title>Sanapingis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: one centred column. A top bar (logo, stars, sound) stays put; the menu and every game swap into #app. */
:root{
  --bg:#f2f7ee; --surface:#ffffff; --ink:#1b2a21; --muted:#56685c; --line:#d3e0cc;
  --green:#237a40; --on-green:#ffffff; --green-tint:#dff0d8;
  --purple:#5a3d9a; --on-purple:#ffffff; --purple-tint:#ebe5f7;
  --yellow:#ffc93c; --yellow-tint:#fff1c2; --yellow-ink:#7a5a00; --star-edge:#b8860b;
  --blue:#2a6fa8; --blue-tint:#dcebf7;
  --good:#237a40; --good-tint:#d7f0dc; --bad:#c93a54; --bad-tint:#fbe1e6;
  --shadow:0 6px 18px rgba(30,60,40,.10);
  --cat:#e8913a; --cat-dark:#b9621a; --cat-light:#fff0dc; --cat-pink:#f2a1a1; --cat-ink:#2b1b12;
  --f-display:'Fredoka','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13201a; --surface:#1c2d24; --ink:#eaf4ec; --muted:#9db3a4; --line:#2d4437;
    --green:#4cc277; --on-green:#0f1f16; --green-tint:#1f3a2a;
    --purple:#b79cf2; --on-purple:#1d1238; --purple-tint:#2f2750;
    --yellow:#ffd35c; --yellow-tint:#4a3d12; --yellow-ink:#ffd35c; --star-edge:#ffe28f;
    --blue:#7db8ec; --blue-tint:#1d3550;
    --good:#5ad68a; --good-tint:#1c3d2a; --bad:#ff7a8f; --bad-tint:#43202a;
    --shadow:0 6px 18px rgba(0,0,0,.35);
    --cat:#f0a65a; --cat-dark:#c4701f; --cat-light:#ffe9cf;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13201a; --surface:#1c2d24; --ink:#eaf4ec; --muted:#9db3a4; --line:#2d4437;
  --green:#4cc277; --on-green:#0f1f16; --green-tint:#1f3a2a;
  --purple:#b79cf2; --on-purple:#1d1238; --purple-tint:#2f2750;
  --yellow:#ffd35c; --yellow-tint:#4a3d12; --yellow-ink:#ffd35c; --star-edge:#ffe28f;
  --blue:#7db8ec; --blue-tint:#1d3550;
  --good:#5ad68a; --good-tint:#1c3d2a; --bad:#ff7a8f; --bad-tint:#43202a;
  --shadow:0 6px 18px rgba(0,0,0,.35);
    --cat:#f0a65a; --cat-dark:#c4701f; --cat-light:#ffe9cf;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:14px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.shell{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;padding:4px 6px 4px 0;border-radius:12px;font:600 1.55rem var(--f-display);color:var(--ink)}
.bar-r{display:flex;align-items:center;gap:8px}
.chip{display:flex;align-items:center;gap:6px;background:var(--yellow-tint);color:var(--yellow-ink);border-radius:999px;padding:5px 14px 5px 10px;font:600 1.15rem var(--f-display);font-variant-numeric:tabular-nums}
.chip svg{width:22px;height:22px}
.chip.pop{animation:pop .45s ease}
.iconbtn{width:42px;height:42px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.iconbtn svg{width:22px;height:22px}
.st{fill:var(--line);stroke:var(--line);stroke-width:1.2;stroke-linejoin:round}
.st.on{fill:var(--yellow);stroke:var(--star-edge)}

/* menu */
.hero h1{font-size:clamp(1.7rem,5.6vw,2.7rem);margin-bottom:8px}
.lead{color:var(--muted);max-width:62ch;margin:0 0 18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;margin-bottom:34px}
.tile{display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px;transition:transform .15s,box-shadow .15s}
.tile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.tile .ic{width:56px;height:56px;border-radius:16px;display:grid;place-items:center}
.tile .ic svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.tile h3{font-size:1.3rem}
.tile p{margin:2px 0 0;color:var(--muted);font-size:.93rem;line-height:1.35}
.c1 .ic{background:var(--purple-tint);color:var(--purple)}
.c2 .ic{background:var(--green-tint);color:var(--green)}
.c3 .ic{background:var(--yellow-tint);color:var(--yellow-ink)}
.c4 .ic{background:var(--blue-tint);color:var(--blue)}
.c5 .ic{background:var(--bad-tint);color:var(--bad)}
h2.sec{font-size:1.4rem;margin-bottom:4px}
.prows{display:grid;gap:10px;margin-top:12px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.arr{font:600 1.4rem var(--f-display);color:var(--muted);text-align:center}
.wcard{display:flex;align-items:center;gap:10px;min-width:0;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:9px 12px}
.wcard:hover{border-color:var(--purple)}
.wcard .e{font-size:1.9rem;line-height:1}
.wcard .tx{display:flex;flex-direction:column;min-width:0}
.wcard b{font:600 1.2rem var(--f-display);line-height:1.15}
.wcard small{color:var(--muted);font-size:.9rem;line-height:1.2}

/* topic switch */
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
.segb{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font:600 1.15rem var(--f-display);text-align:left}
.segb .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:1rem}
.segb[aria-pressed="true"]{border-color:var(--green);background:var(--green-tint)}
.segb[aria-pressed="true"] .n{background:var(--green);color:var(--on-green)}
.wcard b,.wcard small{overflow-wrap:anywhere}
.mface b.long{font-size:.92rem}
.mface b.xl{font-size:.8rem}
.opt.long{font-size:1.05rem}
.opt.xl{font-size:.95rem}

/* shared game chrome */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.top h2{font-size:1.5rem}
.top .count{margin-left:auto;font:600 1.1rem var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.btn{background:var(--green);color:var(--on-green);border:2px solid var(--green);border-radius:999px;min-height:48px;padding:10px 24px;font:600 1.1rem var(--f-display)}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn.secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-inline:10px;min-height:40px;font-size:1rem}
.btn.sm{min-height:40px;padding:6px 18px;font-size:1rem}
.btn.big{min-height:64px;padding:12px 32px;font-size:1.35rem}
.btn:disabled{opacity:.4}
.nav{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
.progress{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
.status{display:flex;gap:18px;color:var(--muted);font-weight:700;margin-bottom:12px;font-variant-numeric:tabular-nums}
.status b{color:var(--ink)}

/* learn */
.duo{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:240px;padding:18px 8px;background:var(--surface);border:3px solid var(--line);border-radius:26px;text-align:center}
.fcard.a{border-color:var(--purple)}
.fcard.b{border-color:var(--green)}
.fcard .e{font-size:clamp(3.4rem,16vw,5rem);line-height:1.1}
.fcard .en{font:600 clamp(1.7rem,7vw,2.4rem) var(--f-display)}
.fcard .fi{font:700 clamp(1.1rem,5vw,1.5rem) var(--f-body);color:var(--muted);opacity:0;transform:translateY(4px);transition:opacity .25s,transform .25s}
.fcard.shown .fi{opacity:1;transform:none}
.fcard .hint{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.fcard.shown .hint{visibility:hidden}
.dots{display:flex;justify-content:center;gap:10px;margin-top:20px}
.fcard .en.long{font-size:clamp(1.3rem,5.5vw,1.8rem)}
.fcard .en.xl{font-size:clamp(1.15rem,4.8vw,1.5rem)}
.ipa{font:600 .95rem var(--f-body);color:var(--purple);overflow-wrap:anywhere}
.wgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin-top:12px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0}
.dot.on{background:var(--purple);border-color:var(--purple)}

/* memory */
.memgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (min-width:560px){.memgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mcard{min-height:100px;aspect-ratio:1/.95;border-radius:18px;border:2px solid var(--purple);background:var(--purple);color:var(--on-purple);display:grid;place-items:center;padding:6px;transition:transform .15s}
.mcard:hover{transform:translateY(-2px)}
.mback{font:600 2rem var(--f-display)}
.mface{display:none;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;line-height:1.15}
.mface b{font:600 1.15rem var(--f-display);overflow-wrap:anywhere}
.mface .e{font-size:1.7rem;line-height:1}
.mcard.up .mback,.mcard.done .mback{display:none}
.mcard.up .mface,.mcard.done .mface{display:flex}
.mcard.en.up,.mcard.en.done{background:var(--purple-tint);color:var(--ink)}
.mcard.fi.up,.mcard.fi.done{background:var(--green-tint);color:var(--ink);border-color:var(--green)}
.mcard.done{border-color:var(--good);opacity:.72}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.mgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.mt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:112px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px}
.mt .e{font-size:2rem;line-height:1.1}
.mt b{font:600 1.3rem var(--f-display)}
.mt:hover:not(:disabled){border-color:var(--purple)}
.mt.sel{border-color:var(--purple);background:var(--purple-tint)}
.mt.done{border-color:var(--good);background:var(--good-tint);opacity:.7}
.found{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;min-height:42px}
.chipx{background:var(--good-tint);border:2px solid var(--good);border-radius:999px;padding:3px 14px;font:600 1.05rem var(--f-display)}

/* quiz + sentences */
.qbox{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:20px 16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:14px}
.prompt{margin:0;color:var(--muted);font-weight:700}
.bigE{font-size:clamp(4rem,20vw,6rem);line-height:1.1}
.bigW{font:600 clamp(2.2rem,10vw,3.2rem) var(--f-display);line-height:1.1}
.sentence{margin:0;font:600 clamp(1.4rem,5.5vw,2rem) var(--f-display);line-height:1.35;text-wrap:balance}
.blank{display:inline-block;min-width:4.2ch;border-bottom:4px dashed var(--purple);text-align:center}
.blank.ok{border-bottom:4px solid var(--good);color:var(--good)}
.blank.bad{border-bottom:4px solid var(--bad);color:var(--bad)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opts.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr))}
.opt{min-height:60px;padding:8px 10px;background:var(--surface);border:3px solid var(--line);border-radius:18px;font:600 1.3rem var(--f-display);overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--purple);transform:translateY(-1px)}
.opt:disabled{opacity:1}
.opt.ok{background:var(--good-tint);border-color:var(--good)}
.opt.ok::after{content:' ✓'}
.opt.bad{background:var(--bad-tint);border-color:var(--bad);animation:shake .4s}
.opt.bad::after{content:' ✗'}
.fb{min-height:3.2rem;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center;font-weight:800}
.okt{color:var(--good)}
.badt{color:var(--bad)}
.badt b,.fb .tr{color:var(--ink)}
.fb .tr{font-weight:700}

/* result */
.result{text-align:center;padding-top:10px}
.result h2{font-size:2rem;margin-bottom:10px}
.rate{display:flex;justify-content:center;gap:8px;margin:6px 0 10px}
.rate .st{width:60px;height:60px}
.rate .st.on{animation:pop .6s ease both}
.rate .st.on:nth-child(2){animation-delay:.15s}
.rate .st.on:nth-child(3){animation-delay:.3s}
.result .big{font:600 2.6rem var(--f-display);margin:0}
.result .lead{margin:6px auto 0}

/* cat theme */
.cat{display:block;flex:none;max-width:100%;overflow:visible}
.cat .eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
.cat .tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 3s ease-in-out infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(12deg)}}
.paw{fill:var(--line)}
.paw.on{fill:var(--cat)}
.chip .paw{fill:var(--cat-dark)}
.hero{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.hero .txt{min-width:0}
.hero .lead{margin-bottom:0}
.hero .cat{width:clamp(72px,22vw,104px);height:auto}
.mback svg{width:34px;height:34px;fill:currentColor;display:block}
.rescat{display:flex;justify-content:center;margin-bottom:6px}
.rescat .cat{width:130px;height:auto}
.rescat.bounce .cat{animation:hop 1s ease-in-out 2}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.rate .paw{width:56px;height:56px}
.rate .paw.on{animation:pop .6s ease both}
.rate .paw.on:nth-child(2){animation-delay:.15s}
.rate .paw.on:nth-child(3){animation-delay:.3s}
.fb .cat{width:44px;height:auto}
.vlist{display:grid;gap:10px;margin-top:12px}
.vrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vsub{font:600 1.05rem var(--f-display);margin-top:18px;color:var(--muted)}
.scene{display:flex;align-items:center;gap:12px;font-size:clamp(3rem,15vw,4.4rem);line-height:1.1}
.scene .who{font-size:.8em}
.scene .at{font:600 1.1rem var(--f-display);color:var(--muted)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <header class="bar">
    <button class="logo" id="homeBtn" aria-label="Alkuun">
      <span id="logoCat" aria-hidden="true"></span>
      <span>Sanapingis</span>
    </button>
    <div class="bar-r">
      <span class="chip" id="starChip" title="Tassut"><span id="chipPaw" aria-hidden="true"></span><b id="starN">0</b></span>
      <button class="iconbtn" id="soundBtn" aria-pressed="true" aria-label="Ääni päällä"></button>
    </div>
  </header>
  <main id="app"></main>
</div>

<script>
(function(){
'use strict';

/* ---------- Sanasto ---------- */
const OPP=[
  ['small','pieni','🐭','big','iso','🐘'],
  ['short','lyhyt','🍄','tall','pitkä','🦒'],
  ['young','nuori','👶','old','vanha','👵'],
  ['weak','heikko','🥀','strong','vahva','💪'],
  ['slow','hidas','🐌','fast','nopea','🐆'],
  ['quiet','hiljainen','🤫','loud','äänekäs','📢']
];
const PLACES=[
  ['school','koulu','🏫','a'],['cinema','elokuvateatteri','🎬','a'],['shop','kauppa','🛍️','a'],['library','kirjasto','📚','a'],
  ['hotel','hotelli','🏨','a'],['café','kahvila','☕','a'],['restaurant','ravintola','🍽️','a'],['zoo','eläintarha','🦁','a'],
  ['airport','lentokenttä','✈️','an'],['hospital','sairaala','🏥','a'],['museum','museo','🏛️','a'],['stadium','stadion','🏟️','a']
];
const oppWords=[];
OPP.forEach((p,i)=>{
  oppWords.push({id:i*2,en:p[0],fi:p[1],e:p[2],opp:i*2+1,art:''});
  oppWords.push({id:i*2+1,en:p[3],fi:p[4],e:p[5],opp:i*2,art:''});
});
/* sanat, jotka voivat sopia samaan kuvaan tai lauseeseen, eivät ole toistensa vääriä vastauksia */
const CONF={small:'A',short:'A',young:'A',big:'B',tall:'B',strong:'B',old:'B',weak:'C',slow:'C',quiet:'C',fast:'D',loud:'D'};
oppWords.forEach(w=>{w.conf=CONF[w.en]});
/* Kuuntele ja toista -sanat: englanti, suomi, kuva, ääntäminen, onko kuvasta apua visassa */
const EXTRA=[
  ['a superhero','supersankari','🦸','/su:pəhiərəu/',1],
  ['It is raining.','Sataa vettä.','🌧️','/it iz reiniŋ/',1],
  ['like','pitää','👍','/laik/',0],
  ['a card game','korttipeli','🃏','/ka:d geim/',1],
  ['are','oletko','💬','/a:(r)/',0],
  ['you','sinä','👉','/ju:/',0],
  ['a mouse','hiiri','🐭','/maus/',1],
  ["I'm",'minä olen','🙋','/aim/',0],
  ["it's",'se on','☝️','/its/',0],
  ['your','sinun','👤','/jɔ:(r)/',0],
  ['a turn','vuoro','🔄','/tə:n/',0],
  ['OK','okei','👌','/əu\'kei/',0],
  ["Don't peek!",'Älä kurki!','🙈','/dəunt pi:k/',0],
  ["No, I'm not.",'Ei, en minä ole.','🙅','/nəu aim nɔt/',0],
  ['or','tai','🔀','/ɔ:(r)/',0],
  ['Yes, I am.','Kyllä, minä olen.','🙆','/jes ai æm/',0],
  ['I','minä','🧍','/ai/',0],
  ['am','olen','💬','/æm/',0],
  ['very','todella','⭐','/veri/',0],
  ['an elephant','norsu','🐘','/elifənt/',1],
  ['Is it my turn?','Onko minun vuoroni?','❓','/iz it mai tə:n/',0]
];
const extraWords=EXTRA.map((p,i)=>({id:12+i,en:p[0],fi:p[1],e:p[2],p:p[3],pic:!!p[4],opp:null,art:'',g:1}));
const placeWords=PLACES.map((p,i)=>({id:i,en:p[0],fi:p[1],e:p[2],opp:null,art:p[3]}));
/* Paikat: Kuuntele ja toista -sanat (englanti, suomi, kuva, ääntäminen, kuva sopii visaan) */
const PEXTRA=[
  ["where","missä","❓","/weə(r)/",0],
  ["where's","missä on","❓","/weəz/",0],
  ["It is","on","📅","/it iz/",0],
  ["Friday","perjantai","📅","/fraidei/",0],
  ["an evening","ilta","🌆","/i:vniŋ/",1],
  ["a movie night","elokuvailta","🍿","/mu:vi nait/",1],
  ["is","on","💬","/iz/",0],
  ["still","vielä","⏳","/stil/",0],
  ["at the shop","kaupalla","🛍️","/æt ðə ʃɔp/",0],

function say(text,force){
  if(!canSpeak||(!soundOn&&!force))return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='en-GB';u.rate=.85;
    speechSynthesis.speak(u);
  }catch(e){}
}
let ac=null;
function tone(freqs){
  if(!soundOn)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    const t=ac.currentTime;
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),s=t+i*.12;
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.0001,s);
      g.gain.exponentialRampToValueAtTime(.18,s+.02);
      g.gain.exponentialRampToValueAtTime(.0001,s+.22);
      o.connect(g);g.connect(ac.destination);o.start(s);o.stop(s+.25);
    });
  }catch(e){}
}

  const pair=b&&a.opp===b.id;
  const nav=n<=8?`<div class="dots">${Array.from({length:n},(_,j)=>`<button class="dot ${j===i?'on':''}" data-a="goto" data-i="${j}" aria-label="Sivu ${j+1}"></button>`).join('')}</div>`
    :`<div class="progress" style="margin-top:20px"><i style="width:${(i+1)/n*100}%"></i></div>`;
  $app.innerHTML=topbar('Opettele',`${i+1} / ${n}`)+
    `<p class="lead">Napauta korttia: kuulet sanan ja näet suomennoksen.</p>
    <div class="duo">${fc(a,'a')}<span class="arr" aria-hidden="true">${pair?'↔':''}</span>${fc(b,'b')}</div>
    ${nav}
    <div class="nav"><button class="btn secondary" data-a="prev" ${i===0?'disabled':''}>Edellinen</button><button class="btn" data-a="next">${i===n-1?'Valmis':'Seuraava'}</button></div>`;

    flipc:el=>{el.classList.add('shown');say(lab(W[+el.dataset.w]),true)},
    goto:el=>go(learn,+el.dataset.i),
    prev:()=>go(learn,i-1),
    next:()=>i===n-1?go(home):go(learn,i+1)
  });
}

  const t=tk;
  const ids=[],seen=new Set();for(const w of shuffle(W)){if(ids.length>=6)break;if(seen.has(w.fi)||seen.has(w.en))continue;seen.add(w.fi);seen.add(w.en);ids.push(w.id)}
  const cards=shuffle(ids.flatMap(id=>[{id,k:'en'},{id,k:'fi'}]));
  let open=[],done=0,moves=0,lock=false;
  const face=c=>c.k==='en'?`<span class="e">${W[c.id].e}</span><b class="${cl(lab(W[c.id]))}">${lab(W[c.id])}</b>`:`<b class="${cl(W[c.id].fi)}">${W[c.id].fi}</b>`;
  $app.innerHTML=topbar('Muistipeli','')+
    `<p class="lead">Violetit kortit ovat englantia, vihreät suomea. Löydä sanapari.</p>
    <div class="status"><span>Siirrot: <b id="mv">0</b></span><span>Parit: <b id="pr">0</b> / 6</span></div>
    <div class="memgrid" id="grid">${cards.map((c,i)=>`<button class="mcard ${c.k}" data-a="flip" data-i="${i}" aria-label="Kortti ${i+1}"><span class="mback">${pawSvg(false)}</span><span class="mface">${face(c)}</span></button>`).join('')}</div>`;
  const grid=$app.querySelector('#grid'),mv=$app.querySelector('#mv'),pr=$app.querySelector('#pr');
  setAct({flip:el=>{
    if(lock)return;
    const i=+el.dataset.i;
    if(open.includes(i)||el.classList.contains('done'))return;
    el.classList.add('up');
    const c=cards[i];
    if(c.k==='en')say(lab(W[c.id]));
    open.push(i);
    if(open.length<2)return;
    moves++;mv.textContent=moves;
    const els=open.map(j=>grid.children[j]);
    if(cards[open[0]].id===cards[open[1]].id){
      good();
      els.forEach(x=>{x.classList.remove('up');x.classList.add('done')});
      open=[];done++;pr.textContent=done;addStars(1);
      if(done===6)setTimeout(()=>{
        if(t!==tk)return;
        result({title:'Kaikki parit löytyivät!',big:`${moves} siirtoa`,rating:moves<=9?3:moves<=14?2:1,text:'Vähemmillä siirroilla saat enemmän tassuja.',again:memory});
      },800);
    }else{
      lock=true;bad();
      setTimeout(()=>{
        if(t!==tk)return;
        els.forEach(x=>x.classList.remove('up'));
        open=[];lock=false;
      },900);
    }
  }});
}

/* ---------- Vastakohdat ---------- */
function match(){
  const picks=sample([0,1,2,3,4,5],4);
  const cards=shuffle(picks.flatMap(i=>[W[i*2],W[i*2+1]]));
  let sel=null,found=0,miss=0;
  $app.innerHTML=topbar('Vastakohdat','0 / 4')+
    `<p class="lead">Napauta sanaa ja sitten sen vastakohtaa.</p>
    <div class="mgrid">${cards.map(w=>`<button class="mt" data-a="pick" data-w="${w.id}"><span class="e">${w.e}</span><b>${w.en}</b></button>`).join('')}</div>
    <div class="found" id="found" aria-live="polite"></div>`;
  const cnt=$app.querySelector('.count'),fl=$app.querySelector('#found');
  setAct({pick:el=>{
    if(el.classList.contains('done'))return;
    const w=W[+el.dataset.w];
    if(sel===null){sel=el;el.classList.add('sel');say(lab(w));return}
    if(sel===el){el.classList.remove('sel');sel=null;return}
    const a=W[+sel.dataset.w];
    say(lab(w));
    if(a.opp===w.id){
      good();
      [sel,el].forEach(x=>{x.classList.remove('sel');x.classList.add('done');x.disabled=true});
      sel=null;found++;cnt.textContent=`${found} / 4`;addStars(1);
      fl.insertAdjacentHTML('beforeend',`<span class="chipx">${a.en} ↔ ${w.en}</span>`);
      if(found===4){
        const t=tk;
        setTimeout(()=>{
          if(t!==tk)return;
          result({title:'Kaikki vastakohdat löytyivät!',big:miss===0?'Ei virheitä':`${miss} virhettä`,rating:miss===0?3:miss<=2?2:1,again:match});
        },900);
      }
    }else{
      miss++;bad();
      const s=sel;sel=null;
      s.classList.add('shake');el.classList.add('shake');
      setTimeout(()=>{s.classList.remove('sel','shake');el.classList.remove('shake')},450);
    }
  }});
}

/* ---------- Visa ---------- */
function quiz(){
  const N=10,t=tk;
  let n=0,score=0,streak=0,locked=false;
  const kinds=canSpeak?['pic','fi2en','en2fi','listen']:['pic','fi2en','en2fi'];
  const qs=sample(W,N).map((w,i)=>{let k=kinds[i%kinds.length];if(k==='pic'&&w.pic===false)k='fi2en';return {w,k}});
  const optsFor=w=>shuffle([w,...distract(w,3)]);
  const advance=()=>{n++;if(n>=N)finish();else ask()};
  function finish(){
    result({title:'Visa valmis!',big:`${score} / ${N}`,rating:rate(score/N),again:quiz});
  }
  function ask(){
    locked=false;
    const q=qs[n],w=q.w,os=optsFor(w),fiAns=q.k==='en2fi';
    let prompt,main;
    if(q.k==='pic'){prompt='Mikä sana tämä on englanniksi?';main=`<div class="bigE">${w.e}</div>`}
    else if(q.k==='fi2en'){prompt='Mikä tämä on englanniksi?';main=`<div class="bigW">${w.fi}</div>`}
    else if(q.k==='en2fi'){prompt='Mitä tämä sana tarkoittaa?';main=`<div class="bigW">${lab(w)}</div><button class="btn secondary sm" data-a="hear">Kuuntele</button>`}
    else{prompt='Kuuntele ja valitse oikea sana.';main=`<button class="btn big" data-a="hear">Kuuntele sana</button>`}
    $app.innerHTML=topbar('Visa',`${n+1} / ${N}`)+
      `<div class="progress"><i style="width:${n/N*100}%"></i></div>
      <div class="qbox"><p class="prompt">${prompt}</p>${main}</div>
      <div class="opts">${os.map(o=>`<button class="opt${cl(fiAns?o.fi:lab(o))}" data-a="ans" data-w="${o.id}">${fiAns?o.fi:lab(o)}</button>`).join('')}</div>
      <div class="fb" id="fb" aria-live="polite"></div>`;
    setAct({
      hear:()=>say(lab(w),true),
      ans:el=>{
        if(locked)return;
        locked=true;
        const id=+el.dataset.w,fb=$app.querySelector('#fb');
        $app.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(+b.dataset.w===w.id)b.classList.add('ok')});
        if(id===w.id){
          score++;streak++;good();addStars(1);
          fb.innerHTML=`${catSvg('happy',44)}<span class="okt">Miau! Oikein!${streak>=3?' Putki: '+streak:''}</span>`;
          say(lab(w));
          setTimeout(()=>{if(t===tk)advance()},1100);
        }else{
          streak=0;el.classList.add('bad');bad();
          fb.innerHTML=`<span class="badt">Oikea vastaus: <b>${lab(w)}</b> = ${w.fi}</span><button class="btn sm" data-a="nxt">${n===N-1?'Tulokset':'Seuraava'}</button>`;
          say(lab(w));
          act.nxt=advance;
        }
      }
    });
    if(q.k==='listen')setTimeout(()=>{if(t===tk)say(lab(w),true)},350);
  }
  ask();
}

/* ---------- Lauseet ---------- */
function sent(){
  const N=8,t=tk;
  const qs=sample(S,N);
  let n=0,score=0,locked=false;
  const advance=()=>{n++;if(n>=N)finish();else ask()};
  function finish(){
    result({title:'Lauseet valmiit!',big:`${score} / ${N}`,rating:rate(score/N),again:sent});
  }
  function ask(){
    locked=false;
    const [e,a,b,ans,fi]=qs[n];
    const w=W.find(x=>x.en===ans);
    const os=shuffle([w,...(w.opp!=null?[W[w.opp]]:distract(w,2,x=>x.en==='school'))]);
    $app.innerHTML=topbar('Lauseet',`${n+1} / ${N}`)+
      `<div class="progress"><i style="width:${n/N*100}%"></i></div>
      <div class="qbox"><div class="bigE">${e}</div><p class="sentence">${a} <span class="blank" id="blank">&nbsp;</span>${b}</p><p class="prompt">${T.sentPrompt}</p></div>
      <div class="opts three">${os.map(o=>`<button class="opt${cl(o.en)}" data-a="ans" data-w="${o.id}">${o.en}</button>`).join('')}</div>
      <div class="fb" id="fb" aria-live="polite"></div>`;
    setAct({ans:el=>{
      if(locked)return;
      locked=true;
      const right=+el.dataset.w===w.id;
      const blank=$app.querySelector('#blank');
      blank.textContent=ans;blank.classList.add(right?'ok':'bad');
      $app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.w===w.id)x.classList.add('ok')});
      if(right){score++;good();addStars(1)}else{el.classList.add('bad');bad()}
      $app.querySelector('#fb').innerHTML=`${right?catSvg('happy',44):''}<span class="${right?'okt':'badt'}">${right?'Miau! Oikein!':'Ei aivan.'}</span><span class="tr">${fi}</span><button class="btn sm" data-a="nxt">${n===N-1?'Tulokset':'Seuraava'}</button>`;
      say(`${a.replace(/<br>/g,' ')} ${ans}${b}`);
      act.nxt=advance;
    }});
  }
  ask();
}

/* ---------- Is vai isn't ---------- */
const PRON=[['He','Hän','👦'],['She','Hän','👧'],['It','Se','🐱']];
const INES={school:'koulussa',cinema:'elokuvateatterissa',shop:'kaupassa',library:'kirjastossa',hotel:'hotellissa','café':'kahvilassa',restaurant:'ravintolassa',zoo:'eläintarhassa',airport:'lentokentällä',hospital:'sairaalassa',museum:'museossa',stadium:'stadionilla'};
function isnt(){
  const N=10,t=tk,core=placeWords.slice(0,12);
  let n=0,score=0,locked=false,last='';
  const qs=[];
  while(qs.length<N){
    const pr=PRON[Math.floor(Math.random()*3)],real=core[Math.floor(Math.random()*12)],truth=Math.random()<.5;
    const said=truth?real:sample(core.filter(x=>x!==real),1)[0];
    const key=pr[0]+real.en+said.en;
    if(key===last)continue;
    last=key;qs.push({pr,real,said,truth});
  }
  const advance=()=>{n++;if(n>=N)result({title:"Is vai isn't: valmis!",big:`${score} / ${N}`,rating:rate(score/N),again:isnt});else ask()};
  function ask(){
    locked=false;
    const q=qs[n],ans=q.truth?'is':"isn't";
    $app.innerHTML=topbar("Is vai isn't",`${n+1} / ${N}`)+
      `<div class="progress"><i style="width:${n/N*100}%"></i></div>
      <div class="qbox"><div class="scene"><span class="who">${q.pr[2]}</span><span class="at">at</span><span>${q.real.e}</span></div>
      <p class="sentence">${q.pr[0]} <span class="blank" id="blank">&nbsp;</span> at ${atw(q.said.en)}.</p>
      <p class="prompt">Katso kuvaa. Valitse is tai isn't.</p></div>
      <div class="opts"><button class="opt" data-a="ans" data-v="is">is</button><button class="opt" data-a="ans" data-v="isn't">isn't</button></div>
      <div class="fb" id="fb" aria-live="polite"></div>`;
    setAct({ans:el=>{
      if(locked)return;
      locked=true;
      const right=el.dataset.v===ans;
      const blank=$app.querySelector('#blank');
      blank.textContent=ans;blank.classList.add(right?'ok':'bad');
      $app.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.dataset.v===ans)x.classList.add('ok')});
      if(right){score++;good();addStars(1)}else{el.classList.add('bad');bad()}
      const fi=`${q.pr[1]} ${q.truth?'on':'ei ole'} ${INES[q.said.en]}.`;
      $app.querySelector('#fb').innerHTML=`${right?catSvg('happy',44):''}<span class="${right?'okt':'badt'}">${right?'Miau! Oikein!':'Ei aivan.'}</span><span class="tr">${fi}</span><button class="btn sm" data-a="nxt">${n===N-1?'Tulokset':'Seuraava'}</button>`;
      say(`${q.pr[0]} ${ans} at ${atw(q.said.en)}`);
      act.nxt=advance;
    }});
  }
  ask();
}
